name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' PersianCalendar/build.gradle.kts | head -1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

      - name: Build debug APK
        run: ./gradlew :PersianCalendar:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release-apks
          APK=$(find PersianCalendar/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find PersianCalendar/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" "release-apks/PersianCalendar-${{ steps.version.outputs.version }}-debug.apk"
          ls -lh release-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Persian Calendar ${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          generate_release_notes: true
          prerelease: true
          files: release-apks/*.apk
