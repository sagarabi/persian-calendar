name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' PersianCalendar/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p release-apks
          find . -type f -path '*/build/outputs/apk/*.apk' -exec cp {} release-apks/ \;
          echo "Generated APKs:"
          ls -lh release-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Persian Calendar ${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          generate_release_notes: true
          prerelease: true
          files: release-apks/*.apk
